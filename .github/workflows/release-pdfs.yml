name: Release PDF from Markdown

on:
  push:
    branches:
      - master
    paths:
      - PITCHME.md
      - PITCHME_jovem.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-pdfs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm i --no-save @marp-team/marp-cli puppeteer
          sudo apt-get update
          sudo apt-get install -y libgbm-dev

      - name: Build PDF
        run: |
          mkdir -p release
          CHROME_PATH=$(node .puppeteer.js) npx marp PITCHME_jovem.md --pdf --allow-local-files --output release/PITCHME_jovem.pdf

      - name: Create release tag
        id: tag
        run: |
          TAG="slides-$(date -u +'%Y%m%d-%H%M%S')-${GITHUB_SHA::7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Slides ${{ steps.tag.outputs.tag }}
          body: |
            Release automática do PDF gerado a partir de `PITCHME_jovem.md`.
          files: |
            release/PITCHME_jovem.pdf
